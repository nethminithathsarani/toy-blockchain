services:
  node-a:
    build:
      context: .
      dockerfile: Dockerfile
    image: toy-blockchain:local
    container_name: toy-blockchain-node-a
    command:
      - node
      - -address
      - 0.0.0.0:8001
      - -advertise
      - node-a:8001
      - -peers
      - node-b:8002
    ports:
      - "8001:8001"
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://localhost:8001/status
      interval: 2s
      timeout: 2s
      retries: 15

  node-b:
    build:
      context: .
      dockerfile: Dockerfile
    image: toy-blockchain:local
    container_name: toy-blockchain-node-b
    command:
      - node
      - -address
      - 0.0.0.0:8002
      - -advertise
      - node-b:8002
      - -peers
      - node-a:8001
    ports:
      - "8002:8002"
    depends_on:
      node-a:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://localhost:8002/status
      interval: 2s
      timeout: 2s
      retries: 15

  node-c:
    build:
      context: .
      dockerfile: Dockerfile
    image: toy-blockchain:local
    container_name: toy-blockchain-node-c
    command:
      - node
      - -address
      - 0.0.0.0:8003
      - -advertise
      - node-c:8003
      - -peers
      - node-a:8001
    ports:
      - "8003:8003"
    depends_on:
      node-a:
        condition: service_healthy
      node-b:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://localhost:8003/status
      interval: 2s
      timeout: 2s
      retries: 15